<!DOCTYPE html>
<html>

<head>
    <title>Receipt Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .test-container {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .pending {
            background-color: #fff3cd;
            border-color: #ffeaa7;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .summary {
            margin-top: 30px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .stat {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-success {
            background-color: #d4edda;
        }

        .stat-error {
            background-color: #f8d7da;
        }
    </style>
</head>

<body>
    <h1>🧪 Receipt Upload Test Suite</h1>
    <p>API Endpoint: <code id="api-url">http://127.0.0.1:8787/api/receipts/upload</code></p>

    <div>
        <input type="file" id="fileInput" accept="image/*" multiple style="margin-bottom: 10px;">
        <button onclick="runTests()">Run Tests</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results"></div>
    <div id="summary" class="summary" style="display: none;"></div>

    <script>
        const API_URL = 'http://127.0.0.1:8787/api/receipts/upload';
        let testResults = [];

        async function testUpload(file) {
            const container = document.createElement('div');
            container.className = 'test-container pending';
            container.innerHTML = `
                <h3>📤 ${file.name}</h3>
                <p>Status: <span class="status">Testing...</span></p>
                <div class="result" style="display: none;"></div>
            `;
            document.getElementById('results').appendChild(container);

            const startTime = Date.now();

            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                const elapsed = Date.now() - startTime;
                const data = await response.json();

                const statusEl = container.querySelector('.status');
                const resultEl = container.querySelector('.result');

                if (response.ok && data.success) {
                    container.className = 'test-container success';
                    statusEl.textContent = `✅ SUCCESS (${elapsed}ms)`;
                    resultEl.style.display = 'block';
                    resultEl.textContent = `Receipt #: ${data.receiptNumber}
AI Recognized: ${data.aiRecognized ? 'Yes' : 'No'}
PDF URL: ${data.pdfUrl}

Receipt Details:
  Vendor: ${data.receipt?.vendor || 'Not detected'}
  Amount: $${data.receipt?.amount?.toFixed(2) || 'Not detected'}
  Date: ${data.receipt?.date || 'Not detected'}
  Description: ${data.receipt?.description || 'Not detected'}
  Category: ${data.receipt?.category || 'Not detected'}`;
                    testResults.push({ file: file.name, success: true, data });
                } else {
                    container.className = 'test-container error';
                    statusEl.textContent = `❌ FAILED (${elapsed}ms)`;
                    resultEl.style.display = 'block';
                    resultEl.textContent = `Error: ${data.error || 'Unknown error'}`;
                    testResults.push({ file: file.name, success: false, error: data.error });
                }
            } catch (error) {
                const elapsed = Date.now() - startTime;
                container.className = 'test-container error';
                container.querySelector('.status').textContent = `❌ FAILED (${elapsed}ms)`;
                const resultEl = container.querySelector('.result');
                resultEl.style.display = 'block';
                resultEl.textContent = `Error: ${error.message}`;
                testResults.push({ file: file.name, success: false, error: error.message });
            }
        }

        async function runTests() {
            const fileInput = document.getElementById('fileInput');
            const files = Array.from(fileInput.files);

            if (files.length === 0) {
                alert('Please select at least one image file');
                return;
            }

            // Clear previous results
            testResults = [];
            document.getElementById('results').innerHTML = '';
            document.getElementById('summary').style.display = 'none';

            // Run tests sequentially
            for (let i = 0; i < files.length; i++) {
                await testUpload(files[i]);
                if (i < files.length - 1) {
                    await new Promise(r => setTimeout(r, 1000)); // Wait 1 second between uploads
                }
            }

            // Show summary
            showSummary();
        }

        function showSummary() {
            const summaryEl = document.getElementById('summary');
            const successful = testResults.filter(r => r.success);
            const failed = testResults.filter(r => !r.success);

            summaryEl.innerHTML = `
                <h2>📊 Test Summary</h2>
                <div class="stats">
                    <div class="stat stat-success">
                        <h3>${successful.length}</h3>
                        <p>Successful</p>
                    </div>
                    <div class="stat stat-error">
                        <h3>${failed.length}</h3>
                        <p>Failed</p>
                    </div>
                </div>
                ${successful.length > 0 ? `
                    <h3>✅ Successful Uploads:</h3>
                    <ul>
                        ${successful.map(s => `<li>${s.file} → ${s.data.receiptNumber}</li>`).join('')}
                    </ul>
                ` : ''}
                ${failed.length > 0 ? `
                    <h3>⚠️ Failed Uploads:</h3>
                    <ul>
                        ${failed.map(f => `<li>${f.file}: ${f.error}</li>`).join('')}
                    </ul>
                ` : ''}
            `;
            summaryEl.style.display = 'block';
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('summary').style.display = 'none';
            testResults = [];
        }

        // Auto-load test images if provided in URL
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('auto') === 'true') {
                alert('Please manually select the test images from tests/recieptImages/');
            }
        });
    </script>
</body>

</html>
