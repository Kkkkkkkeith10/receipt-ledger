name = "receipt-ledger"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
# Rebuild the SvelteKit Cloudflare worker and client on changes
command = "pnpm -s build"
watch_dir = ["src", "static", "svelte.config.js", "vite.config.ts", "package.json", "tsconfig.json"]

[assets]
# Serve SvelteKit's built client assets
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Wrangler will run the build above and watch for changes during `wrangler dev`.

[[d1_databases]]
binding = "DB"
database_name = "accounting-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "accounting-receipts"
preview_bucket_name = "accounting-receipts-preview"

# Azure OpenAI Configuration
# Secrets are set via `wrangler secret put AZURE_FOUNDRY_ENDPOINT` and `wrangler secret put AZURE_FOUNDRY_KEY`
# For local development, secrets are in .dev.vars (not committed to git)
[vars]
AZURE_OPENAI_DEPLOYMENT="gpt-5-mini"